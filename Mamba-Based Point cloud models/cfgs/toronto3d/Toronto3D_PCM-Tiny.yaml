mode: train
seed: 42
deterministic: false

root_dir: ./log
print_freq: 10
val_freq: 1

use_amp: true
sync_bn: false
sched_on_epoch: true
step_per_update: 1
grad_norm_clip: 10.0

wandb:
  use_wandb: false

num_classes: 8
ignore_index: 255
feature_keys: ['x']

model:
  NAME: BaseSeg

  encoder_args:
    NAME: PointMambaEncoder
    in_channels: 3
    embed_dim: 192
    groups: 1
    res_expansion: 1.0
    activation: "relu"
    bias: false
    use_xyz: true
    normalize: "anchor"

    dim_expansion: [1, 1, 2, 1]
    pre_blocks: [1, 1, 1, 1]
    mamba_blocks: [1, 1, 2, 2]
    pos_blocks: [0, 0, 0, 0]

    k_neighbors: [12, 12, 12, 12]
    reducers: [2, 2, 2, 2]

    rms_norm: true
    residual_in_fp32: true
    fused_add_norm: true
    bimamba_type: "v2"
    drop_path_rate: 0.1
    mamba_pos: true

    mamba_layers_orders: ["xyz", "xzy", "yxz", "yzx", "zxy", "zyx"]
    use_order_prompt: true
    prompt_num_per_order: 6

    grid_size: 0.08
    use_windows: false
    combine_pos: false
    block_residual: true

  decoder_args:
    NAME: PointMambaDecoder
    encoder_channel_list: [192, 192, 192, 384, 384]
    decoder_channel_list: [384, 192, 192, 192]
    decoder_blocks: [1, 1, 1, 1]
    mamba_blocks: [0, 0, 0, 0]
    mamba_layers_orders: []

  cls_args:
    NAME: SegHead
    num_classes: 8
    in_channels: null
    global_feat: null
    mlps: [256, 128]
    norm_args:
      norm: 'bn1d'
    act_args:
      act: 'relu'
    dropout: 0.5

dataset:
  common:
    NAME: Toronto3DSphere
    data_root: ./data/Toronto3D
    voxel_size: 0.08
    radius: 3.0
    num_points: 24000
    sample_per_epoch: 5000
    use_intensity: false
    return_height: false
    test_area: 2
    ignore_index: 255
    variable: false
    loop: 1

  train:
    split: train

  val:
    split: val

  test:
    split: val

dataloader:
  num_workers: 6

batch_size: 4
val_batch_size: 4

criterion_args:
  NAME: CrossEntropy
  ignore_index: 255

optimizer:
  NAME: adamw
  weight_decay: 0.05

lr: 0.0001
min_lr: 1.0e-5
warmup_epochs: 5

epochs: 100
sched: multistep
decay_epochs: [70, 90]
decay_rate: 0.5

datatransforms:
  train: [PointsToTensor, PointCloudScaling, PointCloudCenterAndNormalize, PointCloudJitter, ChromaticDropGPU]
  val: [PointsToTensor, PointCloudCenterAndNormalize]
  kwargs:
    jitter_sigma: 0.001
    jitter_clip: 0.005
    scale: [0.8, 1.2]
    gravity_dim: 1
    angle: [0, 1.0, 0]